# WD-Tagger（Danbooru 語彙）→ 本データベースの見出し語
#
# WD-Tagger が確実に当てられるのは外見だけなので、対応表も外見に限っている。
# 性格・関係・展開・構造は画像から判定させない（vision.py と手作業の担当）。
#
#   tags      … いずれかが閾値を超えたらその見出し語を立てる
#   threshold … 既定 0.35 を上書きする（誤検出しやすいタグは高めにする）
#   note      … 判定時の注意。merge.py が出力するメモの下敷きにもなる

# 実例 0 件のまま動かない見出し語（778 名・50巡目の実測）。Danbooru が
# 全面停止している間に、外部を引かずに分かることとして数えた。括弧内は
# suggestions.yaml の near_miss に残っている実測の最大値。
#   糸目 0.545（閾値 0.6）… closed_eyes は「今その絵で閉じている」を含むので
#     わざと高くしている。0 件はこの守りが働いた結果で、直す対象ではない。
#     常時細目を引けるタグが別にあるなら、それに替えるのが筋。
#   貧乳 0.410（閾値 0.5）… 届かない。既定 0.35 まで下げれば当たるが、
#     惜しい記録が 49 件もあり、下げると一度に数十件増える。体型の判定なので
#     ここは人の判断を仰ぐ。
#   無表情 0.333（閾値 0.35）… expressionless が 35% に届かない。
#   喉仏 0.268 ／ つり目 0.253 ／ 色白 0.250 ／ 部屋着 0.239 ／ 背中 0.167
#     … いずれも閾値を下げても届く水準ではなく、タグ自体の付き方が薄い。
#   華奢 0.000 … skinny・slender・narrow_waist が一度も記録に出ていない。
# これらは「語が悪い」のではなく Danbooru から読めないだけで、無表情・色白・
# 華奢・貧乳は資料レーン（プロフィール文）なら書ける。残高が戻るまで
# 降格の判断はしない。
#
# 執事について、57 巡目に書いた見立ては外れていた。当時の実測はセバスチャン・
# ミカエリスの butler 0.238 の 1 件だけで、そこから「黒執事の執事で届かない
# なら誰でも届かない」と書いた。58 巡目にジョーカー（FEif）を入れたら
# butler 55% で素通りした。1 件から天井を語ったのが間違いで、0.238 は
# タグの付き方ではなくセバスチャンの絵の傾向（顔中心の構図が多い）だった。
# 閾値は動かさない。フォン・ライカンには butler がそもそも付かなかった
# （furry 93% が立つ絵柄なので、服装のタグが別の語に食われている）。
#
# 指輪 0.322（閾値 0.35・惜しい 17 件のうち 0.30 以上は 2 件）と
# 無表情 0.338（閾値 0.35・惜しい 10 件のうち 0.30 以上は 2 件）は、
# 58 巡目の 59 名を足しても境界のすぐ下に溜まったままだった。0.30 まで
# 下げても増えるのは各 2 件で、見返りが小さい。無表情はそもそも
# 資料レーンの担当なので、残高が戻れば閾値の話ではなくなる。
#
# 既定の閾値 0.35 を動かさない理由（294 名分の実測、11 巡目）:
# 採用された判定 1157 件の中央値は 66% で、40〜90% に広く散っている。一方
# 閾値に届かなかった側は 0.30〜0.35 に密集していて、境界に谷が無い。
# その帯の中身は玉石混交で、school_uniform（阿良々木暦 0.35）は正しく、
# collarbone（46 件が 0.33 前後）は絵の描き方であってキャラの特徴ではない。
# 全体を下げると鎖骨のような描画上の慣習が大量に混ざるので、下げるなら
# seifuku のように「着ているかいないかしかない」語を個別に下げる。
