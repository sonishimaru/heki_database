# 画像タグでは判定しない見出し語（vision.py または手作業の担当）
#   unaji         … Danbooru に対応タグがない
#   teishinchou   … 身長は単体の絵から判定できない（並んだ絵でのみ分かる）
#   koushinchou   … 同上
#   shisei        … 姿勢の良さを表すタグがない
#   katami        … 物の由来は画像から分からない
