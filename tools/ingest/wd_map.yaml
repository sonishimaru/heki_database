# WD-Tagger（Danbooru 語彙）→ 本データベースの見出し語
#
# WD-Tagger が確実に当てられるのは外見だけなので、対応表も外見に限っている。
# 性格・関係・展開・構造は画像から判定させない（vision.py と手作業の担当）。
#
#   tags      … いずれかが閾値を超えたらその見出し語を立てる
#   threshold … 既定 0.35 を上書きする（誤検出しやすいタグは高めにする）
#   note      … 判定時の注意。merge.py が出力するメモの下敷きにもなる

defaults:
  threshold: 0.35

elements:
  # --- 髪 ---
  chouhatsu:
    tags: [long_hair, very_long_hair, absurdly_long_hair]
  tanpatsu:
    tags: [short_hair, very_short_hair, pixie_cut, undercut, buzz_cut]
  twintail:
    tags: [twintails, low_twintails, short_twintails]
  ponytail:
    tags: [ponytail, high_ponytail, side_ponytail, folded_ponytail]
  hime-cut:
    tags: [hime_cut]
  ahoge:
    tags: [ahoge, antenna_hair, huge_ahoge]
  shirogami:
    tags: [white_hair, grey_hair, silver_hair, platinum_blonde_hair]
  kusekke:
    tags: [messy_hair, bedhead, hair_between_eyes]
    threshold: 0.5
    note: hair_between_eyes は該当率が高すぎるので閾値を上げている
  mekakure:
    tags: [hair_over_eyes, hair_over_one_eye, bangs_over_eyes]

  # --- 目 ---
  jitome:
    tags: [jitome, half-closed_eyes]
  tsurime:
    tags: [tsurime]
  tareme:
    tags: [tareme]
  itome:
    tags: [closed_eyes, "=_="]
    threshold: 0.6
    note: 閉眼と糸目は Danbooru 上で区別されにくい。常時その顔かどうかは要確認
  heterochromia:
    tags: [heterochromia]
  hikari-nashi:
    tags: [empty_eyes, expressionless_eyes, dark_persona]
  gantai:
    tags: [eyepatch, medical_eyepatch]

  # --- 顔 ---
  muhyoujou:
    tags: [expressionless, blank_stare]
  yaeba:
    tags: [fang, fangs, skin_fang]
  namida-bokuro:
    tags: [mole_under_eye, mole_under_mouth]
  kuma:
    tags: [eyebags, dark_circles]
  tsukuri-warai:
    tags: [fake_smile, forced_smile]
    threshold: 0.5

  # --- 体・部位 ---
  te:
    tags: [hand_focus, finger_focus, veiny_arms]
    note: 構図として手が主役になっている場合に立てる
  senaka:
    tags: [back_focus, from_behind, back]
  sakotsu:
    tags: [collarbone]
  nodobotoke:
    tags: ["adam's_apple"]
  kinniku:
    tags: [muscular, muscular_male, muscular_female, abs, toned]
  kyasha:
    tags: [skinny, slender, narrow_waist]
    threshold: 0.5
  kizuato:
    tags: [scar, scar_on_face, scar_across_eye, scar_on_cheek, burn_scar]
  gishi:
    tags: [prosthesis, mechanical_arm, mechanical_hand, artificial_limb]
  kokuin:
    tags: [tattoo, brand_of_sacrifice, symbol_on_body, back_tattoo]

  # --- 服装 ---
  seifuku:
    tags: [school_uniform, serafuku, gakuran, blazer, sailor_collar]
  hakui:
    tags: [labcoat, lab_coat, white_coat]
  wasou:
    tags: [kimono, yukata, japanese_clothes, hakama, haori]
  gunpuku:
    tags: [military_uniform, epaulettes, peaked_cap, military, aiguillette]
  heyagi:
    tags: [pajamas, nightgown, loungewear, casual]
    threshold: 0.5
  bukabuka:
    tags: [oversized_clothes, oversized_shirt, sleeves_past_wrists, sleeves_past_fingers]
  furiru:
    tags: [frills, frilled_dress, lolita_fashion, gothic_lolita, layered_dress]
  gaitou:
    tags: [cape, cloak, coat, long_coat, hooded_cloak, trench_coat]

  # --- 小物 ---
  megane:
    tags: [glasses, semi-rimless_eyewear, round_eyewear, rimless_eyewear, sunglasses]
  tebukuro:
    tags: [gloves, fingerless_gloves, elbow_gloves, black_gloves, white_gloves]
  choker:
    tags: [choker, collar, neck_belt]
  yubiwa:
    tags: [ring, wedding_band, jewelry]
    threshold: 0.5
    note: jewelry は範囲が広いので、指輪が確認できるときだけ採用する
  houtai:
    tags: [bandages, bandaged_arm, bandaged_head, bandaid, bandaged_hand]
  heddohon:
    tags: [headphones, headset, earphones]
  buki:
    tags: [holding_weapon, sword, katana, gun, spear, scythe, holding_sword]

  # --- 種族（外見から確実に読める範囲だけ） ---
  kemomimi:
    tags: [animal_ears, cat_ears, fox_ears, wolf_ears, tail, animal_ear_fluff]
  jingai:
    tags: [horns, monster_girl, slime_girl, lamia, mermaid]
  jinzou:
    tags: [android, robot, robot_joints, mechanical_parts, doll_joints, joints]

  # --- 髪色 ---
  kinpatsu:
    tags: [blonde_hair]
  kurokami:
    tags: [black_hair]
  chapatsu:
    tags: [brown_hair, light_brown_hair]
  akagami:
    tags: [red_hair, orange_hair]
  aogami:
    tags: [blue_hair, light_blue_hair, aqua_hair]
  midorigami:
    tags: [green_hair]
  pinku-gami:
    tags: [pink_hair]
  murasaki-gami:
    tags: [purple_hair, lavender_hair]

  # --- 目の色 ---
  akame:
    tags: [red_eyes]
  aome:
    tags: [blue_eyes, light_blue_eyes, aqua_eyes]
  kin-no-me:
    tags: [yellow_eyes, orange_eyes, amber_eyes]
  midori-no-me:
    tags: [green_eyes]
  murasaki-no-me:
    tags: [purple_eyes, violet_eyes]

  # --- 髪型（追加） ---
  mitsuami:
    tags: [braid, single_braid, twin_braids, french_braid, braided_ponytail]
  odango:
    tags: [hair_bun, double_bun, single_hair_bun]

  # --- 体格（追加） ---
  kasshoku:
    tags: [dark_skin, dark-skinned_female, tan, tanlines]
  irojiro:
    tags: [pale_skin]

  # --- 種族（解像度） ---
  kyuuketsuki:
    tags: [vampire, fang_necklace]
    threshold: 0.4
  tenshi:
    tags: [angel, halo, angel_wings]
  akuma:
    tags: [demon_girl, demon_horns, demon_tail, demon_wings, demon_boy]
  erufu:
    tags: [elf, pointy_ears]
  ryuu:
    tags: [dragon_girl, dragon_horns, dragon_tail, dragon_boy]
  oni:
    tags: [oni, oni_horns]
  yuurei:
    tags: [ghost]

  # --- 記号職 ---
  meido:
    tags: [maid, maid_headdress, maid_apron]
  miko:
    tags: [miko, japanese_shrine_maiden]
  shisutaa:
    tags: [nun, habit]
  naasu:
    tags: [nurse, nurse_cap]
  majo:
    tags: [witch, witch_hat]
  kishi:
    tags: [knight, armor, plate_armor]
    threshold: 0.4
  shitsuji:
    tags: [butler]
  aidoru:
    tags: [idol, idol_clothes]

  # --- 2 巡目 ---
  bob-cut:
    tags: [bob_cut, short_hair_with_long_locks]
  kyonyuu:
    tags: [large_breasts, huge_breasts]
    threshold: 0.5
  hinnyuu:
    tags: [flat_chest, small_breasts]
    threshold: 0.5
  mekakushi:
    tags: [blindfold, covered_eyes]

# 画像タグでは判定しない見出し語（vision.py または手作業の担当）
#   unaji         … Danbooru に対応タグがない
#   teishinchou   … 身長は単体の絵から判定できない（並んだ絵でのみ分かる）
#   koushinchou   … 同上
#   shisei        … 姿勢の良さを表すタグがない
#   katami        … 物の由来は画像から分からない
