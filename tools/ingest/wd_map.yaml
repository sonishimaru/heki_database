# 61 巡目。未対応タグの報告 274 種類を見たが、新しい見出し語に値するものは
# 無かった。2 作品以上に達したのは 16 種類で、そのうち 4 種類は既にある
# 見出し語にタグの綴りが足りていないだけだった。
#   white_wings → 翼（天使の悪魔 0.65・ジブリール 0.70・ミカ 0.73・
#     コロンビーナ 0.37。angel_wings と black_wings は入れていたのに
#     白い翼の綴りだけ抜けていた）
#   body_fur → 獣人（しずえ 0.35・フォン・ライカン 0.53）
#   single_side_bun → お団子（ミカ 0.57・由比ヶ浜結衣 0.48。double_bun と
#     single_hair_bun は入っていた）
#   blue_cape → コート・マント（ディミトリ 0.47・力石徹 0.50。white_cape と
#     red_coat は入っていたので色の綴りを足す前例はある）
# one_eye_covered（北斗 0.36・ディミトリ 0.41・京楽春水 0.39）は入れない。
# 北斗とディミトリは既に眼帯が付いていて、北斗は目隠れも付いている。
# 同じ事実を 3 つの見出し語で数えることになる。
# fur-trimmed_jacket（ギレーヌ 0.47・スコール 0.45）も入れない。
# gaitou は外套の軸で、ファー付きの上着は外套とは限らない。

# 62 巡目。手に持つもの・小さすぎて描かれないものだけ閾値を 0.35 → 0.30 に
# 下げた（指輪・扇子・ランドセル。63巡目に煙草も同じ扱いにした）。
#
# 当初「小物の軸は届かない」と書いたが、言い過ぎだった。同じ appearance.item
# の中でも 手袋 134・得物 89・メガネ 47・ピアス 39・チョーカー 24・鉢巻 23・
# マフラー 14 は 0.35 で何の問題もなく当たっている。分かれ目は軸ではなく、
# それが人物の輪郭の一部かどうかだった。
#   輪郭になる（毎コマ写る）… 手袋・メガネ・マフラー・チョーカー・ピアス
#   持つときだけ写る／小さくて省かれる … 指輪・扇子・ランドセル・煙草・楽器
#
# 33期目で狙った 10 軸のうち 3 軸が動かなかったので実測を並べたら、衣装と
# 髪・体は届くのに後者だけが届かないという切り分けになった。
#   届いた（毎コマ写る）… ローブ 1→5・民族衣装 1→4・ぶかぶかの服 3→6・
#     縦ロール 2→7・天使 2→7・化粧 3→7
#   届かない（一部のコマにしか写らない）… 指輪 0.322・扇子 0.333・
#     ランドセル 0.321。いずれも 0.35 のすぐ下に天井がある。
# 指輪を着けている人物は常に着けているのに、描かれるのが 3 割というだけで、
# 形質の問題ではなく可視性の問題。11 巡目に決めた「下げるなら着ているか
# いないかしかない語を個別に下げる」に沿って、小物 3 語だけ下げる。
# 鎖骨のような描画上の慣習とは違い、小物は写っているかいないかしかない
# ので、11 巡目の懸念（慣習が大量に混ざる）は当てはまらない。
#
# 下げても届かないと分かった語は下げない。
#   ギャル 0.214（及川徹）・色白 0.250（今泉俊輔）… 0.30 でも届かない。
#   作り笑い・ぽっちゃり … 逆引きの上位ですら共起が 0.030 と 0.013 で、
#     そもそもタグの付き方が薄い。ただし共起は per-character の付与率とは
#     別の指標なので、天井の証拠にはしない。34期目で人物を入れて実測する。

# 63 巡目。62巡目の当て直し（933 件・2 時間 59 分・失敗 0）で分かったこと。
#
# 閾値 0.30 は効いた。指輪 1→3・扇子 2→3・ランドセル 1→2 で、予想どおり
# 獄寺隼人 0.3158・胡桃 0.3218・黒神めだか 0.333・宮内れんげ 0.3205 が入った。
#
# 61巡目に足した 4 綴り（white_wings・body_fur・single_side_bun・blue_cape）は
# 実例を 1 件も増やさなかった。翼 18→18・獣人 5→5・お団子 17→17・
# コート・マント 34→34。報告していた 10 名全員が、もっと広いタグで既に
# 同じ見出し語を持っていた。天使の悪魔は wings 92%、ジブリールは wings 88%、
# ミカは wings 87% と hair_bun 70%、しずえは furry 89%、フォン・ライカンは
# furry 93%、ディミトリは cape 59%、力石徹は cape 100%。
# 未対応タグの一覧は「対応表に無いタグ」を出すだけで、その人物が既に同じ
# 見出し語を持っているかは見ていない。色や部位の下位タグはたいてい上位
# タグの傘の下にあるので、穴ではなく重複だった。足した 4 綴りは無害だが
# 何も買っていない。report.py の未対応タグの一覧に「既に持っている要素」を
# 出すようにして、同じ読み違いを繰り返せないようにした。
#
# ぽっちゃりは閾値 0.45 に対してメロン 0.3915 が天井だった（三村かな子
# 0.2696・センシ 0.1519）。既定の 0.35 まで下げればメロンは入るが、これは
# 貧乳（0.410 / 閾値 0.5）と同じ体型の判断なので、人の判断を仰ぐ。
