# キャラクター名鑑（分解の実例）
#
# 初期データは権利関係が明快な古典・パブリックドメイン作品のキャラクターで構成している。
# 現代作品のキャラクターを追加する場合も、記述は「どの要素で構成されているか」の
# 分析に限り、本文・画像の転載は行わないこと。
#
# weight: core（その人物の骨格）/ sub（補強）/ spice（一点差し）

- id: sherlock-holmes
  name: シャーロック・ホームズ
  kana: しゃーろっくほーむず
  work: シャーロック・ホームズ シリーズ
  year: 1887
  author: アーサー・コナン・ドイル
  summary: 観察の精度で世界を読み切る一方、生活能力と情緒だけが欠落している探偵。
  elements:
    - {id: kansatsu, weight: core, note: 靴の泥と袖の擦れから経歴を再構成する}
    - {id: gouri, weight: core, note: 感情を判断材料から明示的に排除している}
    - {id: shokunin, weight: core, note: 専門領域でのみ饒舌になる}
    - {id: zubora, weight: sub, note: 下宿の惨状と不規則な生活}
    - {id: dokuzetsu, weight: sub}
    - {id: hayakuchi, weight: sub, note: 推理の披露時に速度が上がる}
    - {id: aibou, weight: core, note: ワトソンという記録者との対}
    - {id: shukuteki, weight: sub, note: モリアーティという同水準の知性}
    - {id: kako, weight: spice}
  patterns: [kanzen-no-hokorobi, gouri-no-reigai, tekitai-no-rikai]

