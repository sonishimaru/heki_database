    - {id: kikan-gentei, weight: core, note: 帰還の日が確定している}
    - {id: joukyuu-shusshin, weight: sub}
    - {id: kimono, weight: sub}
    - {id: long-straight, weight: spice}
    - {id: hogosha, weight: sub, note: 翁と媼という血縁のない養育}
    - {id: chinmoku, weight: sub, note: 帰還の理由を最後まで説明しない}
    - {id: taijou, weight: core}
    - {id: ushinatta-mono, weight: sub, note: 残される側に穴が空く}
  patterns: [nichijou-no-ikei, ienai-mama-owaru]

