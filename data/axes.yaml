# 分類の軸
# 見出し語（element）は「メガネ」「糸目」「長髪」「手」「両片思い」くらいの解像度で立てる。
# 細かく分けるより、通りのいい言葉ひとつに寄せることを優先する。
# element.axis には "<group>.<axis>" 形式で指定する。

groups:
  - id: appearance
    name: 外見
    summary: 見た瞬間に処理される情報。
    axes:
      - id: hair
        name: 髪
        summary: 長さ・結い方・色。
      - id: eyes
        name: 目
        summary: 目の形と色。
      - id: face
        name: 顔
        summary: 表情の既定値と顔の記号。
      - id: body
        name: 体・部位
        summary: 体格と、そこだけを見てしまう部位。
      - id: costume
        name: 服装
        summary: 何を着ているか。
      - id: item
        name: 小物
        summary: 身に着けているもの、持っているもの。

  - id: attribute
    name: 属性
    summary: その人物が世界の中で占めている座席。
    axes:
      - id: age
        name: 年齢
        summary: 年上か年下か、見た目と合っているか。
      - id: species
        name: 種族
        summary: 人でない部分。
      - id: role
        name: 立場
        summary: 何をしている人か、どこから来たか。

  - id: mind
    name: 性格
    summary: 放っておいたときにその人が取る姿勢。
    axes:
      - id: temperament
        name: 気質
        summary: 感情の出力のしかた。
      - id: creed
        name: 信条
        summary: 選択を迫られたときに何を優先するか。
      - id: wound
        name: 傷
        summary: 埋まっていない穴。

  - id: behavior
    name: 振る舞い
    summary: 内面が表に漏れる経路。
    axes:
      - id: speech
        name: 話し方
        summary: 口調・語彙・声。
      - id: habit
        name: 癖・仕草
        summary: 無意識に出る動き。

  - id: relation
    name: 関係
    summary: 一人では成立しない要素。
    axes:
      - id: type
        name: 関係の型
        summary: 二人がどういう間柄か。
      - id: state
        name: 関係の状態
        summary: その関係が今どうなっているか。

  - id: narrative
    name: 展開
    summary: 物語の中でその人物に割り当てられた仕事。
    axes:
      - id: role
        name: 役割
        summary: 誰の何を担当しているか。
      - id: arc
        name: 結末
        summary: どこへ向かうか。

  - id: structure
    name: 構造
    summary: 要素そのものではなく、要素の配置から生まれる性質。
    axes:
      - id: gap
        name: ギャップ
        summary: 同一人物の中の矛盾。
      - id: secret
        name: 秘密
        summary: 伏せられている情報。
      - id: limited
        name: 限定・反復
        summary: 「このときだけ」と「毎回これ」。
