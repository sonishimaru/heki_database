# 自動取り込みのキュー
#
# ここにキャラクターを足すと、GitHub Actions（毎日）が公開リソースから取得・分析し、
# data/characters_auto.yaml へ書き込む。既存のエントリも 30 日ごとに再取得される。
#
# 書き方:
#   - id: anya-forger                  # 省略すると name から生成
#     name: アーニャ・フォージャー
#     kana: あーにゃふぉーじゃー
#     work: SPY×FAMILY
#     year: 2022
#     danbooru: anya_(spy_x_family)    # キャラクタータグ（外見の群衆合意）
#     anilist: Anya Forger             # AniList の検索名（プロフィール）
#     pages:                           # 資料ページ（公式サイト・Wikipedia・Fandom など）
#       - https://ja.wikipedia.org/wiki/SPY%C3%97FAMILY
#
# 注意: pixiv百科事典は Cloudflare のボット保護があり Actions からは取得できない（403）。
# pixiv の記事を使いたい場合は手元で fetch.py page を実行して work/ に置くか、
# Wikipedia / Fandom / 公式サイトの URL を使う。
#
# danbooru / anilist / pages はどれも任意。書いたレーンだけが動く。

