# 外見・造形の構成要素

- id: long-straight
  name: ロングストレート
  kana: ろんぐすとれーと
  aliases: [黒髪ロング]
  axis: appearance.hair
  summary: 手入れの行き届いた長い直毛。静止画で最も面積を取る記号。
  description: >-
    長さそのものが「時間をかけて維持されている」という情報になる。乱れたときの落差が大きく、
    風・水・寝起きといった外力の可視化装置としても機能する。
  effect: 平常時の完成度を高く設定し、以降のあらゆる崩れを事件に変える。
  pairs_with: [shisei-no-yosa, hime-cut, muhyoujou]
  contrasts_with: [hane-kami, hair-down]
  tags: [定番, 崩し前提]

- id: twintail
  name: ツインテール
  kana: ついんてーる
  aliases: []
  axis: appearance.hair
  summary: 左右対称に結い上げた髪。感情に合わせて揺れる可動部を二つ増設する。
  description: >-
    左右対称は幼さと自己演出の両方を示す。本人が「そう見られたくて結っている」という
    意思の痕跡が残る点で、生来の造形ではなく選択の記号である。
  effect: 感情の振れ幅を物理的な揺れに翻訳し、見た目の年齢を下げる。
  pairs_with: [tsurime, ohirakebo, kohaku]
  contrasts_with: [hair-down]
  tags: [定番, 自己演出]

- id: ponytail
  name: ポニーテール
  kana: ぽにーてーる
  aliases: [一つ結び]
  axis: appearance.hair
  summary: 動くために髪をまとめた形。うなじと首の線が露出する。
  description: >-
    「これから何かをする」という実務的な合図。結ぶ動作・解く動作の両方が
    場面の切り替えとして使えるため、時間の経過を表現しやすい。
  effect: 有能さと隙を同時に置ける。結い直す仕草だけで一場面が成立する。
  pairs_with: [shisei-no-yosa, short-nape, kinniku]
  contrasts_with: [hair-down]
  tags: [実務, 動作つき]

- id: hime-cut
  name: 姫カット
  kana: ひめかっと
  aliases: []
  axis: appearance.hair
  summary: 前髪と頬の左右を水平に切り揃えた様式。輪郭が額縁になる。
  description: >-
    直線で構成されるため、顔が「飾られている」印象になる。家格・伝統・管理された育ちを
    一撃で示せる記号で、和装とも洋装とも接続できる。
  effect: 育ちの良さと近寄りがたさを同時に付与する。
  pairs_with: [long-straight, kimono, joukyuu-shusshin]
  contrasts_with: [hane-kami]
  tags: [様式, 階級]

- id: ahoge
  name: アホ毛
  kana: あほげ
  aliases: [一本立ち]
  axis: appearance.hair
  summary: 整えた髪から一本だけ跳ねた毛。制御外の部位。
  description: >-
    本人の意思とは無関係に動くパーツであり、感情のインジケータとして
    無断で本音を漏らす。整った髪型ほど効く。
  effect: どれだけ取り繕っていても内心が漏れている、という状態を常時可視化する。
  pairs_with: [muhyoujou, hohoemi-no-kamen, long-straight]
  contrasts_with: []
  tags: [記号, 感情漏洩]

- id: shirogami
  name: 白髪・銀髪
  kana: しろがみ
  aliases: [銀髪, プラチナ]
  axis: appearance.hair
  summary: 色素の抜けた髪。人ならざるものか、代償を払った者を示す。
  description: >-
    自然界の初期値から外れた色は、種族・魔術・寿命・喪失といった来歴の暗示に使われる。
    「もとは違う色だった」という前史を仕込める点が強い。
  effect: 説明抜きで異物感を与え、過去に何かがあったと観客に推測させる。
  pairs_with: [hitonarazaru, kokuin, kizuato]
  contrasts_with: []
  tags: [来歴, 異物感]

- id: inner-color
  name: インナーカラー・メッシュ
  kana: いんなーからー
  aliases: [差し色]
  axis: appearance.hair
  summary: 内側や一房だけ色を変えた髪。角度によって見え隠れする。
  description: >-
    正面からは隠れ、動いたときだけ現れる。本人が選んだ色である以上、
    表向きの顔とは別の趣味が存在することの証拠になる。
  effect: 「見えている面が全部ではない」ことを造形レベルで宣言する。
  pairs_with: [futatsu-no-kao, heyagi]
  contrasts_with: []
  tags: [現代, 二面性]

- id: hair-down
  name: 結い解き
  kana: ゆいほどき
  aliases: [髪を下ろす]
  axis: appearance.hair
  summary: 常時結っている髪を解いた状態。日常の平常運転から外れた姿。
  description: >-
    結っている姿を先に十分見せてあることが前提条件になる、差分でしか成立しない要素。
    入浴後・就寝前・負傷後など、社会的役割を降りた場面に配置される。
  effect: 役割を脱いだ状態を一目で示し、見た側に「見てはいけないものを見た」感覚を与える。
  pairs_with: [ponytail, heyagi, futari-dake]
  contrasts_with: [ponytail, hime-cut]
  tags: [差分, 限定開示]

- id: short-nape
  name: うなじの見える短髪
  kana: うなじのみえるたんぱつ
  aliases: [刈り上げ, ショート]
  axis: appearance.hair
  summary: 首筋が常時露出している髪型。防御を捨てた部位が見えている。
  description: >-
    短さは決断・軽さ・過去との断絶を示す。切った理由が語られる場合、
    髪型そのものが物語の要約になる。
  effect: 潔さを見せながら、無防備な一点を晒し続ける。
  pairs_with: [kinniku, kihakusa, ponytail]
  contrasts_with: [long-straight]
  tags: [決断, 無防備]

- id: hane-kami
  name: 癖っ毛・寝癖
  kana: くせっけ
  aliases: [はねた髪]
  axis: appearance.hair
  summary: 整わない髪。生活の手触りが残っている。
  description: >-
    管理されていないことが、そのまま「他人の目を気にしていない」あるいは
    「気にする余裕がない」という情報になる。
  effect: 生活感と隙を供給し、他人が手を伸ばす口実を作る。
  pairs_with: [heyagi, kuma, zubora]
  contrasts_with: [long-straight, hime-cut]
  tags: [生活感, 隙]

- id: jitome
  name: ジト目
  kana: じとめ
  aliases: [半目]
  axis: appearance.eyes
  summary: 感情の温度を下げた半開きの目。呆れと観察の中間。
  description: >-
    相手を見ているのに評価を下げている、という二重の動作を一つの表情で行う。
    無関心ではなく「見た上で呆れている」点が重要。
  effect: 関心を持っていることを隠しきれないまま、態度だけ冷たくできる。
  pairs_with: [dokuzetsu, tsundere, tsukkomi]
  contrasts_with: [ohirakebo]
  tags: [表情, 呆れ]

- id: tareme
  name: たれ目
  kana: たれめ
  aliases: []
  axis: appearance.eyes
  summary: 目尻の下がった形。既定値として柔らかい印象を出す。
  description: >-
    黙っていても好意的に見えるため、実際の内面が冷たい場合の落差装置になる。
    優しい人物にも、優しく見えるだけの人物にも使える両刃。
  effect: 第一印象を無条件に和らげ、その後の内面提示で裏切る余地を残す。
  pairs_with: [hohoemi-no-kamen, sewayaki]
  contrasts_with: [tsurime]
  tags: [表情, 第一印象]

- id: tsurime
  name: つり目
  kana: つりめ
  aliases: []
  axis: appearance.eyes
  summary: 目尻の上がった形。攻撃性と気の強さの既定値。
  description: >-
    黙っていても怒って見えるため、本人が意図せず誤解される状況を作れる。
    弱った場面での効き目が大きい。
  effect: 強気の記号を貼っておき、崩れたときの落差を確保する。
  pairs_with: [tsundere, twintail, kihakusa]
  contrasts_with: [tareme]
  tags: [表情, 強気]

- id: heterochromia
  name: オッドアイ
  kana: おっどあい
  aliases: [虹彩異色]
  axis: appearance.eyes
  summary: 左右で色の異なる目。身体そのものが非対称である証。
  description: >-
    人為的な改造、混血、憑依など「二つのものが一人に同居している」ことの
    最短の表現。片目を隠す演出と組み合わせやすい。
  effect: 一人の中に二つの出自が同居していると、視覚だけで宣言する。
  pairs_with: [hitonarazaru, futatsu-no-kao, houtai]
  contrasts_with: []
  tags: [異物感, 二重性]

- id: hikari-no-nai-me
  name: 光のない目
  kana: ひかりのないめ
  aliases: [ハイライトが消える]
  axis: appearance.eyes
  summary: 瞳の反射が失われた状態。感情の供給が止まっている合図。
  description: >-
    通常時にハイライトがあることが前提の差分表現。数コマだけ消える運用が最も効く。
    常時消えている場合は、既に一度壊れた後の人物を示す。
  effect: 台詞なしで「今この人物は限界を越えた」と伝える。
  pairs_with: [muhyoujou, kowareta-egao, tsumi-no-ishiki]
  contrasts_with: [ohirakebo]
  tags: [差分, 破綻]

- id: me-o-sorasu
  name: 目を逸らす
  kana: めをそらす
  aliases: [視線が合わない]
  axis: appearance.eyes
  summary: 視線を外す動作。会話の内容と身体の反応が食い違う瞬間。
  description: >-
    嘘、照れ、罪悪感のいずれでも起きるため、観客に解釈を要求する。
    直後に視線を戻すかどうかで意味が確定する。
  effect: 発話内容を信用しなくてよい、と観客に知らせる。
  pairs_with: [tsundere, tsumi-no-ishiki, kuchibeta]
  contrasts_with: [misue]
  tags: [動作, 不一致]

- id: misue
  name: 目を逸らさない
  kana: めをそらさない
  aliases: [見据える]
  axis: appearance.eyes
  summary: 視線を固定し続ける。圧としての凝視。
  description: >-
    捕食者の挙動でもあり、誠実さの証明でもある。どちらに転ぶかは
    相手が先に目を逸らすかどうかで決まる。
  effect: 会話の主導権を、台詞ではなく視線の持続時間で決着させる。
  pairs_with: [yoyuu, shihaisha, kansatsu-guse]
  contrasts_with: [me-o-sorasu]
  tags: [動作, 支配]

- id: yaeba
  name: 八重歯
  kana: やえば
  aliases: []
  axis: appearance.face
  summary: 整列から外れた歯。笑ったときだけ見える不完全さ。
  description: >-
    完璧に整っていないことが、親しみと野性の両方に読み替えられる。
    笑顔という限定条件つきでしか露出しない点に価値がある。
  effect: 笑ったときだけ出る差分を作り、笑顔の希少性を上げる。
  pairs_with: [ohirakebo, kihakusa]
  contrasts_with: []
  tags: [記号, 限定露出]

- id: namida-bokuro
  name: 泣きぼくろ
  kana: なきぼくろ
  aliases: []
  axis: appearance.face
  summary: 目の下の小さな点。顔の一点に視線を固定する。
  description: >-
    それ自体は何も語らないが、「泣いた跡」という誤読を常時誘発する。
    無表情の人物に付けると、悲しみの先取りとして働く。
  effect: 感情表現なしで、その人物に涙の予感を貼り付ける。
  pairs_with: [muhyoujou, hohoemi-no-kamen]
  contrasts_with: []
  tags: [記号, 予感]

- id: muhyoujou
  name: 無表情
  kana: むひょうじょう
  aliases: [鉄面皮]
  axis: appearance.face
  summary: 表情の既定値がゼロであること。感情がないのではなく出力されない。
  description: >-
    観客は情報の欠落を埋めようとするため、無表情は最も雄弁な表情になる。
    わずかな変化がすべて事件として読まれる、増幅器としての機能を持つ。
  effect: 表情の変化量あたりの情報密度を最大化する。
  pairs_with: [ahoge, kuchibeta, hitonarazaru, mimi-ga-akai]
  contrasts_with: [ohirakebo]
  tags: [基準値, 増幅器]

- id: hohoemi-no-kamen
  name: 貼り付いた笑顔
  kana: はりついたえがお
  aliases: [営業スマイル, 笑顔の仮面]
  axis: appearance.face
  summary: 常に微笑んでいる状態。表情が防具として運用されている。
  description: >-
    崩さないこと自体が意思表示であり、笑顔の下は観測できない。
    崩れる瞬間を物語の到達点に置ける。
  effect: 内面へのアクセスを遮断し、その遮断が破れる場面に価値を集中させる。
  pairs_with: [tareme, kurokoge-no-honne, kowareta-egao]
  contrasts_with: [muhyoujou]
  tags: [防具, 崩し前提]

- id: kohaku
  name: 小柄
  kana: こがら
  aliases: [低身長]
  axis: appearance.body
  summary: 平均より小さい体躯。あらゆる相手との間に高低差を作る。
  description: >-
    見下ろされる側に固定されるため、当人の能力や地位が高い場合に
    強い不一致が生まれる。物理的な非対称の常設装置。
  effect: 実力や立場との落差を、立っているだけで発生させる。
  pairs_with: [nenrei-sabaku, shihaisha, twintail]
  contrasts_with: [nagami]
  tags: [非対称, 落差源]

- id: nagami
  name: 長身
  kana: ながみ
  aliases: [高身長]
  axis: appearance.body
  summary: 平均より大きい体躯。視界と圧を占有する。
  description: >-
    庇う・覆う・遮るといった動作が自然に成立する。屈まなければ
    目線が合わないという条件が、そのまま関係の描写になる。
  effect: 保護と威圧のどちらにも転べる物理的優位を常設する。
  pairs_with: [kinniku, kabau, yoyuu]
  contrasts_with: [kohaku]
  tags: [非対称, 保護]

- id: kyasha
  name: 華奢
  kana: きゃしゃ
  aliases: [細い首, 折れそう]
  axis: appearance.body
  summary: 線の細い身体。壊れやすさが常時提示されている。
  description: >-
    強い言動や高い戦闘力と組み合わせると、能力と器の不一致が際立つ。
    受け手に「支えなければ」という誤った責任感を発生させる。
  effect: 本人の強さと無関係に、周囲へ保護欲を発生させる。
  pairs_with: [kyoujin-na-ishi, muri-o-suru, choker]
  contrasts_with: [kinniku]
  tags: [脆弱, 誤読誘発]

- id: kinniku
  name: 鍛えられた身体
  kana: きたえられたからだ
  aliases: [筋肉]
  axis: appearance.body
  summary: 訓練の蓄積が形になった身体。過去の時間が可視化されている。
  description: >-
    才能ではなく反復の証拠であるため、努力の履歴を説明せずに示せる。
    傷跡と併置すると、生き延びてきた回数まで伝わる。
  effect: 積み重ねた年月を、体型そのもので保証する。
  pairs_with: [kizuato, short-nape, shokunin-kishitsu]
  contrasts_with: [kyasha]
  tags: [履歴, 説得力]

- id: shisei-no-yosa
  name: 姿勢の良さ
  kana: しせいのよさ
  aliases: [背筋が伸びている]
  axis: appearance.body
  summary: 立ち姿の直立。育ちか訓練のいずれかが背景にある。
  description: >-
    緊張ではなく既定値としての直立は、身体に染み込んだ規律を示す。
    崩れた姿勢を一度でも見せると、その場面が特別扱いになる。
  effect: 規律の内面化を無言で示し、脱力を貴重品に変える。
  pairs_with: [joukyuu-shusshin, gunpuku, keigo]
  contrasts_with: [zubora]
  tags: [規律, 崩し前提]

- id: seifuku
  name: 制服
  kana: せいふく
  aliases: [学生服]
  axis: appearance.costume
  summary: 集団への所属を示す既製の衣。個体差が着崩し方に集約される。
  description: >-
    全員が同じ物を着ているという前提が、袖の長さ・ボタン・着方の
    わずかな差を人格情報に変換する。期限つきの身分でもある。
  effect: 同一の枠を用意することで、微細な差異を性格の情報に変える。
  pairs_with: [heyagi, kikan-gentei, oversized]
  contrasts_with: [gunpuku]
  tags: [所属, 期限つき]

- id: hakui
  name: 白衣
  kana: はくい
  aliases: [ラボコート]
  axis: appearance.costume
  summary: 職能を示す上着。羽織るだけで専門性が付与される。
  description: >-
    脱いだ状態との落差が作りやすく、下に何を着ているかで人格が露出する。
    清潔さの記号でありながら、汚れの目立つ布でもある。
  effect: 専門家の顔と素の顔を、一枚の脱ぎ着で切り替える。
  pairs_with: [shokunin-kishitsu, kuma, zubora]
  contrasts_with: []
  tags: [職能, 切替装置]

- id: kimono
  name: 和装
  kana: わそう
  aliases: [着物]
  axis: appearance.costume
  summary: 可動域を制限する伝統衣。所作が衣に規定される。
  description: >-
    走れない、大股で歩けないという制約が、そのまま所作の様式を作る。
    制約を破って走る場面は、それだけで異常事態の宣言になる。
  effect: 動きに制約を課し、制約を破る瞬間の意味を跳ね上げる。
  pairs_with: [hime-cut, joukyuu-shusshin, keigo]
  contrasts_with: []
  tags: [様式, 制約]

- id: gunpuku
  name: 軍服・礼装
  kana: ぐんぷく
  aliases: [制帽, 詰襟]
  axis: appearance.costume
  summary: 権限と責任を身体に貼り付ける衣。個人より役職が先に立つ。
  description: >-
    着ている間は組織の意思として振る舞う必要がある。階級章や手袋など、
    脱ぐ手順が多いほど「脱いだ状態」の情報量が増える。
  effect: 個人と役職を分離し、どちらとして喋っているかを常に問える。
  pairs_with: [shihaisha, keigo, tebukuro]
  contrasts_with: [heyagi, seifuku]
  tags: [権威, 役職]

- id: oversized
  name: 大きすぎる上着
  kana: おおきすぎるうわぎ
  aliases: [借り物, ぶかぶか]
  axis: appearance.costume
  summary: 身体に合っていない衣。持ち主が別にいることを示す。
  description: >-
    サイズの不一致は関係の痕跡そのものであり、袖が余っている状態が
    そのまま体格差と親密さの証拠になる。
  effect: 二人の関係を、他方の不在下でも視覚的に証明する。
  pairs_with: [nagami, futari-dake, katami]
  contrasts_with: []
  tags: [関係の痕跡, 体格差]

- id: heyagi
  name: 部屋着
  kana: へやぎ
  aliases: [私服, 寝間着]
  axis: appearance.costume
  summary: 他人に見せる前提のない衣。社会的な役割を降りた状態。
  description: >-
    公の姿を十分に見せてある人物ほど効果が高い。誰の前でその姿になるかが、
    そのまま信頼の証明になる。
  effect: 役割の外側にいる姿を示し、それを見られる立場を特別にする。
  pairs_with: [hair-down, hane-kami, futari-dake]
  contrasts_with: [gunpuku, seifuku]
