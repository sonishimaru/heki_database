# 外見

# --- 髪 ---
- id: chouhatsu
  name: 長髪
  kana: ちょうはつ
  aliases: [ロング, 黒髪ロング]
  axis: appearance.hair
  summary: 髪が長いこと。手入れの時間がそのまま外見に出る。
  description: >-
    長さ自体が「維持されている」という情報になる。風・水・寝起きで乱れるため、
    崩れの見せ場を常に用意できる。
  effect: 平常時の完成度を高く置き、乱れたときの差を大きくする。
  pairs_with: [shisei, hime-cut, muhyoujou]
  contrasts_with: [tanpatsu, kusekke]
  tags: [定番]

- id: tanpatsu
  name: 短髪
  kana: たんぱつ
  aliases: [ショート, 刈り上げ]
  axis: appearance.hair
  summary: 髪が短いこと。首筋が出る。
  description: >-
    短さは決断や身軽さと読まれる。切った理由が語られる場合、髪型がそのまま経歴の要約になる。
  effect: 潔さを見せつつ、うなじという無防備な一点を常時晒す。
  pairs_with: [unaji, kinniku, karetsu]
  contrasts_with: [chouhatsu]
  tags: [定番]

- id: twintail
  name: ツインテール
  kana: ついんてーる
  aliases: []
  axis: appearance.hair
  summary: 左右に結い分けた髪。感情に合わせて揺れる。
  description: >-
    本人が「そう見られたくて結っている」という選択の跡が残る。左右対称が幼さを足す。
  effect: 感情の起伏を物理的な揺れに翻訳する。
  pairs_with: [tsurime, tenshin, teishinchou]
  contrasts_with: []
  tags: [定番]

- id: ponytail
  name: ポニーテール
  kana: ぽにーてーる
  aliases: [一つ結び]
  axis: appearance.hair
  summary: まとめ髪。動くために結っている。
  description: >-
    結ぶ・解くの両方が場面の切り替えに使える。うなじが出る。
  effect: 実務の合図を出しつつ、解いた姿を特別扱いにできる。
  pairs_with: [unaji, shisei, kinniku]
  contrasts_with: []
  tags: [定番]

- id: hime-cut
  name: 姫カット
  kana: ひめかっと
  aliases: []
  axis: appearance.hair
  summary: 前髪と頬の髪を水平に切り揃えた形。
  description: >-
    直線で構成されるため、顔が額縁に入って見える。家格や管理された育ちを一撃で示す。
  effect: 育ちの良さと近寄りがたさを同時に付ける。
  pairs_with: [chouhatsu, wasou, reijou]
  contrasts_with: [kusekke]
  tags: [様式]

- id: ahoge
  name: アホ毛
  kana: あほげ
  aliases: [一本立ち]
  axis: appearance.hair
  summary: 一本だけ跳ねた毛。本人の制御外で動く。
  description: >-
    意思と無関係に動くため、感情を無断で漏らす。整った髪型ほど効く。
  effect: 取り繕っていても内心が漏れている状態を常時見せる。
  pairs_with: [muhyoujou, tsukuri-warai, chouhatsu]
  contrasts_with: []
  tags: [感情漏れ]

- id: shirogami
  name: 白髪
  kana: しらが
  aliases: [銀髪, 白い髪]
  axis: appearance.hair
  summary: 色素の抜けた髪。人でないか、何かを支払った者。
  description: >-
    自然な初期値から外れた色は、種族・魔術・寿命・喪失の暗示になる。
    「もとは違う色だった」という前史を仕込める。
  effect: 説明なしに異物感を出し、過去に何かあったと推測させる。
  pairs_with: [jingai, kokuin, furou]
  contrasts_with: []
  tags: [来歴]

- id: kusekke
  name: 癖っ毛
  kana: くせっけ
  aliases: [寝癖, はねた髪]
  axis: appearance.hair
  summary: 整わない髪。生活の手触りが残る。
  description: >-
    管理されていないことが、他人の目を気にしていない／気にする余裕がないという情報になる。
  effect: 生活感と隙を出し、他人が手を伸ばす口実を作る。
  pairs_with: [heyagi, kuma, zubora]
  contrasts_with: [chouhatsu, hime-cut]
  tags: [生活感]

- id: mekakure
  name: 目隠れ
  kana: めかくれ
  aliases: [前髪が長い]
  axis: appearance.hair
  summary: 前髪で目が見えないこと。
  description: >-
    表情の主要部が遮られるため、口元だけで感情を読ませることになる。
    髪を上げる／風で見える一瞬が見せ場になる。
  effect: 表情を伏せておき、見えた瞬間を事件にする。
  pairs_with: [hitomishiri, kogoe, muhyoujou]
  contrasts_with: []
  tags: [遮蔽]

# --- 目 ---
- id: itome
  name: 糸目
  kana: いとめ
  aliases: [細目, 笑い目]
  axis: appearance.eyes
  summary: 常に細められている目。瞳が見えない。
  description: >-
    穏やかにも読め、何も考えていないようにも読め、何を考えているか分からないとも読める。
    開いた一回で意味が確定する、単独では中身を持たない記号。
  effect: 内心の読み取りを封じ、目を開く瞬間に全部を預ける。
  pairs_with: [tsukuri-warai, keigo, haraguro, tareme]
  contrasts_with: [mitsumeru]
  tags: [定番, 遮蔽, 開き待ち]

- id: jitome
  name: ジト目
  kana: じとめ
  aliases: [半目]
  axis: appearance.eyes
  summary: 温度を下げた半開きの目。呆れと観察の中間。
  description: >-
    見ているのに評価は下げている、という二重の動作を一つの表情でやる。
    無関心ではなく「見た上で呆れている」のが要点。
  effect: 関心があることを隠しきれないまま、態度だけ冷たくできる。
  pairs_with: [dokuzetsu, tsundere, tsukkomi]
  contrasts_with: [tenshin]
  tags: [定番]

- id: tareme
  name: たれ目
  kana: たれめ
  aliases: []
  axis: appearance.eyes
  summary: 目尻が下がった形。黙っていても柔らかい。
  description: >-
    第一印象が無条件に好意的になるため、中身が冷たい場合の落差装置になる。
  effect: 入口を和らげ、あとで裏切る余地を残す。
  pairs_with: [tsukuri-warai, sewayaki, itome]
  contrasts_with: [tsurime]
  tags: [定番]

- id: tsurime
  name: つり目
  kana: つりめ
  aliases: []
  axis: appearance.eyes
  summary: 目尻が上がった形。黙っていても強気。
  description: >-
    意図せず怒って見えるため、誤解される状況が自動的に生まれる。弱ったときの落差が大きい。
  effect: 強気の記号を貼り、崩れたときの差を確保する。
  pairs_with: [tsundere, twintail, karetsu]
  contrasts_with: [tareme]
  tags: [定番]

- id: heterochromia
  name: オッドアイ
  kana: おっどあい
  aliases: [左右で色が違う]
  axis: appearance.eyes
  summary: 左右で色の異なる目。
  description: >-
    改造・混血・憑依など「二つのものが一人に同居している」ことの最短表現。片目を隠す演出と相性がいい。
  effect: 一人の中に二つの出自があると視覚だけで宣言する。
  pairs_with: [jingai, nimensei, gantai]
  contrasts_with: []
  tags: [異物感]

- id: hikari-nashi
  name: ハイライトのない目
  kana: はいらいとのないめ
  aliases: [光のない目, 目が死んでいる]
  axis: appearance.eyes
  summary: 瞳の反射が消えている状態。
  description: >-
    通常時に光があることが前提の差分表現。数コマだけ消える運用が最も効く。
    常時消えている場合は、既に一度壊れた後の人物を示す。
  effect: 台詞なしで限界を越えたことを伝える。
  pairs_with: [muhyoujou, kuzureru-egao, zaiakukan]
  contrasts_with: [tenshin]
  tags: [破綻]

- id: gantai
  name: 眼帯
  kana: がんたい
  aliases: [片目を隠す]
  axis: appearance.eyes
  summary: 片目を覆っているもの。
  description: >-
    中身が何かより、隠され続けていること自体が情報になる。外す場面のために着けている。
  effect: 未開示の情報を顔に貼り付け、外す場面を予約する。
  pairs_with: [heterochromia, houtai, kako]
  contrasts_with: []
  tags: [秘匿]

# --- 顔 ---
- id: muhyoujou
  name: 無表情
  kana: むひょうじょう
  aliases: [鉄面皮]
  axis: appearance.face
  summary: 表情の既定値がゼロ。感情がないのではなく出力されない。
  description: >-
    観客が欠落を埋めようとするため、無表情は最も雄弁になる。
    わずかな変化がすべて事件として読まれる増幅器。
  effect: 表情の変化量あたりの情報密度を最大化する。
  pairs_with: [ahoge, kuchibeta, jingai, mimi-ga-akai]
  contrasts_with: [tenshin]
  tags: [基準値, 増幅器]

- id: tsukuri-warai
  name: 作り笑い
  kana: つくりわらい
  aliases: [営業スマイル, 貼り付いた笑顔]
  axis: appearance.face
  summary: 常に笑っている状態。笑顔が防具になっている。
  description: >-
    崩さないこと自体が意思表示で、下は観測できない。崩れる瞬間を到達点に置ける。
  effect: 内面へのアクセスを遮断し、それが破れる場面に価値を集める。
  pairs_with: [tareme, itome, tatemae-honne, kuzureru-egao]
  contrasts_with: [muhyoujou]
  tags: [防具]

- id: yaeba
  name: 八重歯
  kana: やえば
  aliases: []
  axis: appearance.face
  summary: 整列から外れた歯。笑ったときだけ見える。
  description: >-
    完璧に整っていないことが親しみにも野性にも読める。笑顔という条件つきでしか出ない。
  effect: 笑ったときだけの差分を作り、笑顔の希少性を上げる。
  pairs_with: [tenshin, karetsu]
  contrasts_with: []
  tags: [限定露出]

- id: namida-bokuro
  name: 泣きぼくろ
  kana: なきぼくろ
  aliases: []
  axis: appearance.face
  summary: 目の下の小さな点。
  description: >-
    それ自体は何も語らないが「泣いた跡」という誤読を常時誘発する。無表情に付けると悲しみの先取りになる。
  effect: 感情表現なしで涙の予感を貼り付ける。
  pairs_with: [muhyoujou, tsukuri-warai, itome]
  contrasts_with: []
  tags: [予感]

- id: kuma
  name: 目の下の隈
  kana: くま
  aliases: [寝不足]
  axis: appearance.face
  summary: 睡眠と生活の欠損が顔に出たもの。
  description: >-
    何かに時間を吸われている証拠。仕事・執着・不眠・後悔のどれとも接続でき、原因を伏せたまま異常を示せる。
  effect: 生活が壊れている事実を、本人の申告なしに開示する。
  pairs_with: [hakui, zubora, zaiakukan, kusekke]
  contrasts_with: []
  tags: [消耗]

# --- 体・部位 ---
- id: te
  name: 手
  kana: て
  aliases: [指, 手つき]
  axis: appearance.body
  summary: 手そのもの。骨張り、指の長さ、爪、手つき。
  description: >-
    顔と違って本人が演技しにくく、職業と生活が最も正直に出る部位。
    差し出す・掴む・触れないという動作の主語になるため、関係の描写を全部引き受けられる。
  effect: 人格と関係の両方を、顔を映さずに一箇所で語らせる。
  pairs_with: [tebukuro, shokunin, kizuato, te-guse]
  contrasts_with: []
  tags: [定番, 部位, 動作]

- id: unaji
  name: うなじ
  kana: うなじ
  aliases: [首筋]
  axis: appearance.body
  summary: 髪をまとめたときに出る首の後ろ。
  description: >-
    本人の視界に入らない部位であるため、無防備さが本人の自覚なしに成立する。
    見えるかどうかが髪型に依存する、条件つきの部位。
  effect: 本人が意図していない露出を作り、見る側だけを後ろめたくする。
  pairs_with: [ponytail, tanpatsu, choker]
  contrasts_with: []
  tags: [部位, 無防備]

- id: sakotsu
  name: 鎖骨
  kana: さこつ
  aliases: [首元]
  axis: appearance.body
  summary: 襟から覗く骨の線。
  description: >-
    服の開き具合でしか見えないため、衣装の設計とセットでしか成立しない。
    痩身や消耗の指標にもなる。
  effect: 服の一段の緩みを、そのまま情報量に変える。
  pairs_with: [kyasha, choker, heyagi]
  contrasts_with: []
  tags: [部位]

- id: senaka
  name: 背中
  kana: せなか
  aliases: [背中越し]
  axis: appearance.body
  summary: 相手に見せている後ろ姿。
  description: >-
    表情が見えないため、観客は台詞と姿勢だけで読むことになる。
    預ける・追う・見送るという動作が全部ここに乗る。
  effect: 表情を封じたまま、感情の重い場面を成立させる。
  pairs_with: [aibou, kizuato, saikai]
  contrasts_with: []
  tags: [部位, 演出]

- id: nodobotoke
  name: 喉仏
  kana: のどぼとけ
  aliases: [喉]
  axis: appearance.body
  summary: 喉の隆起。飲み込む動きで動く。
  description: >-
    急所であると同時に、緊張や動揺が可視化される場所。上を向いたときにだけ出る。
  effect: 言葉にしない動揺を、身体の一点で見せる。
  pairs_with: [choker, keigo, muhyoujou]
  contrasts_with: []
  tags: [部位, 急所]

- id: teishinchou
  name: 低身長
  kana: ていしんちょう
  aliases: [小柄, ちびっこ]
  axis: appearance.body
  summary: 平均より小さい体。誰と並んでも高低差ができる。
  description: >-
    見下ろされる側に固定されるため、当人の能力や地位が高い場合に強い不一致が出る。
  effect: 実力や立場との落差を、立っているだけで発生させる。
  pairs_with: [mitame-sabaku, joushi, twintail]
  contrasts_with: [koushinchou]
  tags: [定番, 落差源]

- id: koushinchou
  name: 高身長
  kana: こうしんちょう
  aliases: [長身]
  axis: appearance.body
  summary: 平均より大きい体。視界と圧を占める。
  description: >-
    庇う・覆う・遮るが自然に成立する。屈まないと目線が合わないという条件が関係の描写になる。
  effect: 保護と威圧のどちらにも転べる優位を常設する。
  pairs_with: [kinniku, kabau, yoyuu]
  contrasts_with: [teishinchou]
  tags: [定番]

- id: kyasha
  name: 華奢
  kana: きゃしゃ
  aliases: [細い, 折れそう]
  axis: appearance.body
  summary: 線の細い体。壊れやすさが常時出ている。
  description: >-
    強い言動や高い戦闘力と組み合わせると、能力と器の不一致が際立つ。
  effect: 本人の強さと無関係に、周囲へ保護欲を発生させる。
  pairs_with: [tsuyoi-noni-moroi, muri, sakotsu]
  contrasts_with: [kinniku]
  tags: [脆さ]

- id: kinniku
  name: 筋肉
  kana: きんにく
  aliases: [鍛えた体]
  axis: appearance.body
  summary: 訓練の蓄積が形になった体。
  description: >-
    才能ではなく反復の証拠であるため、努力の履歴を説明せずに示せる。
  effect: 積み重ねた年月を体型そのもので保証する。
  pairs_with: [kizuato, tanpatsu, shokunin]
  contrasts_with: [kyasha]
  tags: [履歴]

- id: shisei
  name: 姿勢がいい
  kana: しせいがいい
  aliases: [背筋が伸びている]
  axis: appearance.body
  summary: 立ち姿がまっすぐなこと。
  description: >-
    緊張ではなく既定値としての直立は、身体に染みた規律を示す。崩れた姿勢が特別扱いになる。
  effect: 規律の内面化を無言で示し、脱力を貴重品に変える。
  pairs_with: [reijou, gunpuku, keigo]
  contrasts_with: [zubora]
  tags: [規律]

- id: kizuato
  name: 傷跡
  kana: きずあと
  aliases: [古傷]
  axis: appearance.body
  summary: 治ったあとに残る痕。生き延びた物証。
  description: >-
    傷の位置が、守った物と守れなかった物を示す。本人が語らないほど推測の余地が増える。
  effect: 語られていない過去が確実にあると身体で保証する。
  pairs_with: [kinniku, kako, shirogami]
  contrasts_with: []
  tags: [過去]

- id: gishi
  name: 義肢
  kana: ぎし
  aliases: [義手, 義足]
  axis: appearance.body
  summary: 失った部位を置き換えた機構。
  description: >-
    失った事実と、それでも動いている事実を同時に出す。整備の場面が休息と対話の場になる。
  effect: 喪失を消さないまま前へ進んでいることを構造で示す。
  pairs_with: [tebukuro, kizuato, jinzou]
  contrasts_with: []
  tags: [喪失]

- id: kokuin
  name: 刻印
  kana: こくいん
  aliases: [烙印, 契約紋]
  axis: appearance.body
  summary: 体に刻まれた所属や契約の印。自分では消せない。
  description: >-
    本人の意思と無関係に押されている場合、身体が他人に書き込まれた状態になる。
    隠すか晒すかの選択が立場の表明になる。
  effect: 意思の外側にある拘束を、身体に固定表示する。
  pairs_with: [keiyaku, shujuu, tebukuro, shirogami]
  contrasts_with: []
  tags: [拘束]

# --- 服装 ---
- id: seifuku
  name: 制服
  kana: せいふく
  aliases: [学生服]
  axis: appearance.costume
  summary: 集団への所属を示す既製の服。
  description: >-
    全員が同じ物を着ている前提が、着崩し方のわずかな差を人格情報に変える。期限つきの身分でもある。
  effect: 同一の枠を用意し、微細な差だけを性格として読ませる。
  pairs_with: [heyagi, kikan-gentei, bukabuka]
  contrasts_with: [gunpuku]
  tags: [定番, 所属]

- id: hakui
  name: 白衣
  kana: はくい
  aliases: [ラボコート]
  axis: appearance.costume
  summary: 職能を示す上着。羽織るだけで専門性が付く。
  description: >-
    脱いだ状態との落差が作りやすく、下に何を着ているかで人格が出る。
  effect: 専門家の顔と素の顔を、一枚の脱ぎ着で切り替える。
  pairs_with: [shokunin, kuma, zubora]
  contrasts_with: []
  tags: [職能]

- id: wasou
  name: 和装
  kana: わそう
  aliases: [着物, 浴衣]
  axis: appearance.costume
  summary: 可動域を制限する伝統衣。所作が服に規定される。
  description: >-
    走れない、大股で歩けないという制約が所作の様式を作る。破って走る場面が異常事態の宣言になる。
  effect: 動きに制約を課し、破る瞬間の意味を跳ね上げる。
  pairs_with: [hime-cut, reijou, keigo]
  contrasts_with: []
  tags: [様式]

- id: gunpuku
  name: 軍服
  kana: ぐんぷく
  aliases: [制帽, 詰襟, 礼装]
  axis: appearance.costume
  summary: 権限と責任を身体に貼り付ける服。個人より役職が先に立つ。
  description: >-
