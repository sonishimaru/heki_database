# 属性／性格

# --- 年齢 ---
- id: toshiue
  name: 年上
  kana: としうえ
  aliases: [姉貴分, 兄貴分]
  axis: relation.type
  summary: 相手より長く生きている立場。
  description: >-
    先に知っている優位が既定値になるため、対等になった瞬間や追い越された瞬間が事件になる。
  effect: 上位の座席を先に与え、そこから降りる過程を作る。
  pairs_with: [yoyuu, sewayaki, kabau]
  contrasts_with: [toshishita]
  tags: [定番]

- id: toshishita
  name: 年下
  kana: としした
  aliases: [弟分, 妹分]
  axis: relation.type
  summary: 相手より後から来た立場。
  description: >-
    庇護される側に置かれるため、対等に扱われた一回が本人にとって特別になる。
    追いつこうとする運動を最初から抱えている。
  effect: 成長という運動を初期状態で内蔵させる。
  pairs_with: [toshi-no-sa, shitei, gyakuten]
  contrasts_with: [toshiue]
  tags: [定番]

- id: toshi-no-sa
  name: 年の差
  kana: としのさ
  aliases: [歳の差]
  axis: relation.type
  summary: 二人の間に開いている年齢の幅。
  description: >-
    経験・体格・社会的立場のすべてに非対称を作る。差が縮まらないことが分かっているため、
    対等になろうとする試み自体が物語になる。
  effect: 埋まらない距離を一つ設定し、その扱い方に人格を出させる。
  pairs_with: [toshiue, toshishita, shitei, hogosha]
  contrasts_with: []
  tags: [定番, 非対称]

- id: furou
  name: 不老
  kana: ふろう
  aliases: [長命, 年を取らない]
  axis: appearance.species
  summary: 他人より遥かに長い時間を生きること。
  description: >-
    見送る側に固定されるため、関係を持つこと自体がコストになる。無関心を装う理由になる。
  effect: 「どうせ先に失う」という前提を全関係に敷く。
  pairs_with: [jingai, teikan, soushitsu, shirogami]
  contrasts_with: []
  tags: [喪失前提]

- id: mitame-sabaku
  name: 見た目年齢詐欺
  kana: みためねんれいさぎ
  aliases: [童顔, ロリババア, 老けている]
  axis: appearance.build
  summary: 実年齢と見た目が合っていないこと。
  description: >-
    周囲が外見に基づいて接するため、本人は常に誤った扱いを受け続ける。その誤差が諦めにも武器にもなる。
  effect: 対人関係のすべてに恒常的な誤差を注入する。
  pairs_with: [teishinchou, furou, dokuzetsu, jingai]
  contrasts_with: []
  tags: [落差源]

# --- 種族 ---
- id: jingai
  name: 人外
  kana: じんがい
  aliases: [人ならざるもの, 神, 妖, 魔]
  axis: appearance.species
  summary: 人間の枠の外にいる存在。倫理と感覚の基準が違う。
  description: >-
    人間の常識が通じないため、通じた瞬間の意味が跳ね上がる。人になっていくことも、
    人をやめていくことも軸にできる。
  effect: 共感の成立そのものを到達点に変える。
  pairs_with: [muhyoujou, shirogami, heterochromia, kokuin]
  contrasts_with: []
  tags: [定番, 異物感]

- id: kemomimi
  name: 獣耳
  kana: けものみみ
  aliases: [尻尾, 獣人]
  axis: appearance.species
  summary: 人型に付いた動物の耳や尾。意思と無関係に動く。
  description: >-
    尾や耳は制御外で感情を表示する。取り繕う人物ほど、そこだけが正直という構図になる。
  effect: 言動と別系統の感情表示器を身体に増設する。
  pairs_with: [ahoge, muhyoujou, jingai]
  contrasts_with: []
  tags: [定番, 感情漏れ]

- id: jinzou
  name: 人形・機械
  kana: にんぎょう
  aliases: [アンドロイド, 人造]
  axis: appearance.species
  summary: 作られた存在。目的を与えられて生まれている。
  description: >-
    命令と自分の意思の区別がつかないという固有の問題を抱える。自分で選んだ最初の一回が頂点になる。
  effect: 自由意志の有無そのものを問いとして常設する。
  pairs_with: [muhyoujou, keiyaku, gishi, kako]
  contrasts_with: []
  tags: [目的]

- id: fushi
  name: 不死
  kana: ふし
  aliases: [死ねない, 再生]
  axis: appearance.species
  summary: 損なわれても戻る身体。痛みが終わらない。
  description: >-
    死という退路が塞がれているため、自己犠牲が犠牲として成立しない。生を罰として扱える。
  effect: 終わりを禁止し、消耗だけが蓄積する状態を作る。
  pairs_with: [furou, teikan, zaiakukan]
  contrasts_with: []
  tags: [終わらない]

# --- 立場 ---
- id: shokunin
  name: 職人
  kana: しょくにん
  aliases: [技術屋, 専門家]
  axis: relation.position
  summary: 一つの領域に特化した技能者。そこでだけ饒舌になる。
  description: >-
    普段は無口でも専門の話では別人のように喋る。技能の話をしている間だけ警戒が解ける。
  effect: 専門領域という一点に、性格の抜け道を用意する。
  pairs_with: [buki, megane, hakui, kuchibeta, te]
  contrasts_with: []
  tags: [特化]

- id: joushi
  name: 上に立つ人
  kana: うえにたつひと
  aliases: [上司, 上官, 王, 隊長]
  axis: relation.position
  summary: 他人の生殺与奪に責任を持つ立場。決定が仕事になっている。
  description: >-
    弱音を吐く相手がいないという構造的な孤立を伴う。誰にも見せない場所を必ず一つ持つ。
  effect: 責任の重さと引き換えに、常時の孤立を発生させる。
  pairs_with: [gunpuku, yoyuu, mitsumeru, teishinchou]
  contrasts_with: [juusha]
  tags: [孤立]

- id: juusha
  name: 従者
  kana: じゅうしゃ
  aliases: [参謀, side, 支える側]
  axis: relation.position
  summary: 誰かの隣で機能する立場。自分の願いを後回しにする職能。
  description: >-
    「あなたのため」が言い訳として無限に使えるため、自分の欲望を最後まで言語化しないで済む。
  effect: 本人の欲望を構造的に隠し、露出したときの威力を溜める。
  pairs_with: [sewayaki, jiko-gisei, shujuu, kataomoi]
  contrasts_with: [joushi]
  tags: [定番, 抑圧]

- id: muhoumono
  name: 無法者
  kana: むほうもの
  aliases: [ならず者, 賞金首]
  axis: relation.position
  summary: 社会の外側で生きる者。制度に守られていない。
  description: >-
    信用の代わりに腕で立っているため、約束を守る場面の重みが増す。帰る場所がないことが自由と裏表。
  effect: 規範の外に置くことで、規範を守る選択を能動的にする。
  pairs_with: [nagaremono, gaitou, buki, giri]
  contrasts_with: [keigo]
  tags: [規範外]

- id: reijou
  name: 令嬢・御曹司
  kana: れいじょう
  aliases: [名家, 王族, いいところの子]
  axis: relation.position
  summary: 家の格を背負って生まれた立場。所作と義務が先に決まっている。
  description: >-
    個人の願いより家の都合が優先されるため、自分で選ぶという行為そのものが反逆になる。
  effect: 選択の自由を初期状態で奪い、取り戻す過程を物語にする。
  pairs_with: [hime-cut, wasou, keigo, shisei]
  contrasts_with: [nagaremono]
  tags: [定番, 不自由]

- id: nagaremono
  name: 流れ者
  kana: ながれもの
  aliases: [根無し草, 旅人]
  axis: relation.position
  summary: 定住しない立場。いつでも去れる状態を保っている。
  description: >-
    去る自由を持ち続けることが防衛で、留まる決断が最大の変化になる。過去を語らない理由にもなる。
  effect: 「いつでも消える」を前提にし、留まる選択を重くする。
  pairs_with: [gaitou, kako, muhoumono, yosomono]
  contrasts_with: [reijou]
  tags: [非定住]

- id: yosomono
  name: 余所者
  kana: よそもの
  aliases: [異邦人, 転移者]
  axis: relation.position
  summary: その土地の文化を共有していない者。
  description: >-
    知らないがゆえに問える立場で、観客の代理として機能する。馴染んだ後も同化しきらない残余が残る。
  effect: 世界の説明役を兼ねつつ、土着になれない距離を保つ。
  pairs_with: [kansatsu, nagaremono, jingai]
  contrasts_with: [osananajimi]
  tags: [外部視点]

- id: fuguu
  name: 不遇な生い立ち
  kana: ふぐうなおいたち
  aliases: [陰のある育ち]
  axis: mind.wound
  summary: 標準的な養育を受けていない履歴。常識が欠けている。
  description: >-
    当たり前を知らない、あるいは過剰に警戒するという形で日常動作に生い立ちが出る。
    本人は異常だと気づいていない。
  effect: 小さな挙動に、説明されていない過去を滲ませる。
  pairs_with: [jikokoutei, kako, misuterare]
  contrasts_with: []
  tags: [欠落]

# --- 気質 ---
- id: tsundere
  name: ツンデレ
  kana: つんでれ
  aliases: [素直じゃない, 天邪鬼]
  axis: mind.temperament
  summary: 好意を反対の言葉で出力する癖。
  description: >-
    観客には本心が見えていて、作中の相手には見えていないという非対称が面白さの本体。
    本人にも自覚がない場合、さらに深くなる。
  effect: 観客だけが真意を知る状態を作り、もどかしさを生む。
  pairs_with: [tsurime, me-o-sorasu, mimi-ga-akai, dokuzetsu]
  contrasts_with: [tenshin]
  tags: [定番]

- id: kuudere
  name: クーデレ
  kana: くーでれ
  aliases: [平熱が低い, 淡白]
  axis: mind.temperament
  summary: 感情の出力が常に小さいこと。
  description: >-
    基準が低いため、わずかな温度上昇が事件として検出される。本人は変化を自覚していない。
  effect: 感情の検出感度を上げ、微小な変化を大事件に変える。
  pairs_with: [muhyoujou, kogoe, jitome]
  contrasts_with: [tenshin]
  tags: [定番, 増幅器]

- id: tenshin
  name: 天真爛漫
  kana: てんしんらんまん
  aliases: [裏表がない, 陽キャ, 明るい]
  axis: mind.temperament
  summary: 感情をそのまま出す性質。隠す機能を持たない。
  description: >-
    嘘がつけないため、この人物が黙る場面が異常事態の合図になる。閉じた人物を開ける触媒にもなる。
  effect: 明るさを基準値にし、翳った一瞬を最大の情報にする。
  pairs_with: [yaeba, twintail, karetsu]
  contrasts_with: [tsundere, kuudere, haraguro]
  tags: [触媒]

- id: tennen
  name: 天然
  kana: てんねん
  aliases: [ずれている, 無自覚]
  axis: mind.temperament
  summary: 場の前提を共有しないまま普通に喋る性質。
  description: >-
    悪意なしに核心を突く、あるいは核心を外す。どちらも周囲の緊張を勝手に処理してしまう。
  effect: 場の空気を無視できる唯一の人物として、硬直を壊す役を担う。
  pairs_with: [tenshin, itome, kogoe]
  contrasts_with: [tsukkomi, gouri]
  tags: [定番]

- id: yoyuu
  name: 余裕
  kana: よゆう
  aliases: [大人の態度, 泰然]
  axis: mind.temperament
  summary: 何が起きても動じない構え。
  description: >-
    余裕は維持コストのかかる演技でもある。崩れたときに「ずっと無理をしていた」という解釈修正が起きる。
  effect: 崩す価値のある高さを設定し、落差の位置エネルギーを溜める。
  pairs_with: [toshiue, mitsumeru, koushinchou, joushi]
  contrasts_with: [karetsu]
  tags: [定番, 崩し前提]

- id: karetsu
  name: 苛烈
  kana: かれつ
  aliases: [激情, 気迫, 短気]
  axis: mind.temperament
  summary: 感情の出力が強い性質。加減という機能がない。
  description: >-
    常に全力であるため消耗が早く、続かないことが最初から見えている。その持続不能性が魅力になる。
  effect: 燃焼速度の速さを提示し、終わりの予感を漂わせる。
  pairs_with: [tsurime, tanpatsu, ganko, muri]
  contrasts_with: [yoyuu]
  tags: [消耗]

- id: hitomishiri
  name: 人見知り
  kana: ひとみしり
  aliases: [対人不安, 内向的]
  axis: mind.temperament
  summary: 他人との接触にコストがかかる性質。
  description: >-
    近づける相手の少なさが、選ばれた相手の価値を自動的に上げる。話しかけた一回が達成になる。
  effect: 交流の単価を上げ、些細な接触を出来事に変える。
  pairs_with: [kogoe, heddohon, kuchibeta, mekakure]
  contrasts_with: [tenshin]
  tags: [定番]

- id: dokuzetsu
  name: 毒舌
  kana: どくぜつ
  aliases: [口が悪い]
  axis: mind.temperament
  summary: 攻撃的な語彙を既定値にする性質。
  description: >-
    的確に刺すには相手をよく見ている必要があり、悪口の精度がそのまま関心の強さの証明になる。
  effect: 攻撃の形をした関心を出力し、本人だけがそれに気づかない。
  pairs_with: [tsundere, jitome, kansatsu, mitame-sabaku]
  contrasts_with: [keigo]
  tags: [定番]

- id: sewayaki
  name: 世話焼き
  kana: せわやき
  aliases: [面倒見がいい, 過保護]
  axis: mind.temperament
  summary: 他人の生活に手を出す性質。自分の事は後回しになる。
  description: >-
    他人を世話している間は自分を見なくて済むという回避でもある。相手を失うと何も残らない構造を作れる。
  effect: 献身で自己の空白を隠し、その露出を用意する。
  pairs_with: [tareme, toshiue, juusha, jikokoutei]
  contrasts_with: []
  tags: [定番, 回避]

- id: zubora
  name: ずぼら
  kana: ずぼら
  aliases: [だらしない, 生活能力がない]
  axis: mind.temperament
  summary: 私生活が破綻している性質。
  description: >-
    仕事や戦闘での有能さと同居させると、能力の偏りが人間味になる。世話を焼く口実にもなる。
  effect: 有能さの裏に穴を開け、他人が入り込む隙を作る。
  pairs_with: [kuma, kusekke, heyagi, hakui]
  contrasts_with: [shisei, furiru]
  tags: [定番, 隙]

- id: neko-o-kaburu
  name: 猫を被る
  kana: ねこをかぶる
  aliases: [キャラを作っている, ぶりっ子, 自己演出]
  axis: mind.temperament
  summary: 見られ方を自分で設計している状態。
  description: >-
    演じている自覚があるうちは制御できるが、続けるうちにどちらが本体か分からなくなる。
  effect: 「本当の自分」という問いを常時抱えさせる。
  pairs_with: [furiru, tsukuri-warai, nimensei, desuwa]
  contrasts_with: [tenshin]
  tags: [演技]

- id: haraguro
  name: 腹黒
  kana: はらぐろ
  aliases: [食えない, 底が見えない]
  axis: mind.temperament
  summary: 穏やかな表層の下で計算している性質。
  description: >-
    善意の形をした行動が、後から別の目的を持っていたと分かる。
    悪人とは限らず、味方の側にいるほうが厄介で面白い。
  effect: すべての親切に、後から意味が変わる余地を残す。
  pairs_with: [itome, tsukuri-warai, gouri, tatemae-honne]
  contrasts_with: [tenshin]
  tags: [定番]

# --- 信条 ---
- id: ganko
  name: 頑固
  kana: がんこ
  aliases: [曲げない, 信念]
  axis: mind.creed
  summary: 損得と無関係に選択を固定する原理。
  description: >-
    周囲を巻き込みながら進むため、被害と成果が同時に出る。折れる場面があれば、その一回が中心になる。
  effect: 行動を予測可能にし、逸脱した一回の意味を最大化する。
  pairs_with: [karetsu, yakusoku, jiko-gisei]
  contrasts_with: [gouri, teikan]
  tags: [定番]

- id: jiko-gisei
  name: 自己犠牲
  kana: じこぎせい
  aliases: [身を投げ出す]
  axis: mind.creed
  summary: 自分の損失を先に選ぶ原理。
  description: >-
    美談として処理されがちだが、実態は自己評価の低さであることが多い。止める側がいて初めて欠陥として見える。
  effect: 献身の裏に自己否定を隠し、それを見抜く他者を必要にする。
  pairs_with: [jikokoutei, juusha, zaiakukan, kabau]
  contrasts_with: [gouri]
  tags: [定番]

- id: giri
  name: 義理堅い
  kana: ぎりがたい
  aliases: [筋を通す, 恩義]
  axis: mind.creed
  summary: 受けた恩に返礼を義務とする原理。感情より順序を優先する。
  description: >-
    好悪と別の軸で行動が決まるため、敵対しながら助けるというねじれが自然に成立する。
  effect: 感情と行動を切り離し、敵味方の線を曖昧にする。
  pairs_with: [muhoumono, kari, shukuteki, yakusoku]
  contrasts_with: []
  tags: [ねじれ]

- id: gouri
  name: 合理主義
  kana: ごうりしゅぎ
  aliases: [効率優先, 冷徹]
  axis: mind.creed
  summary: 感情を計算から除外する原理。
  description: >-
    合理で説明できない選択をした瞬間に、本人の中の例外が露出する。その例外が誰かが最大の情報になる。
  effect: 例外を作った時点で、その相手が特別だと自動的に証明させる。
  pairs_with: [muhyoujou, megane, joushi, kansatsu]
  contrasts_with: [jiko-gisei, ganko, tennen]
  tags: [定番, 例外検出]

- id: teikan
  name: 諦観
  kana: ていかん
  aliases: [虚無, 期待しない]
  axis: mind.creed
  summary: 結果に期待しない構え。失望を先回りして避けている。
  description: >-
    傷つかないための装備であるため、期待してしまう場面が無防備になる場面と一致する。
  effect: 期待という行為自体をリスクに変える。
  pairs_with: [furou, fushi, hikari-nashi, misuterare]
  contrasts_with: [ganko]
  tags: [防衛]

# --- 傷 ---
- id: zaiakukan
  name: 罪悪感
  kana: ざいあくかん
  aliases: [贖罪, 後悔]
  axis: mind.wound
  summary: 過去の選択を清算できていない状態。幸福を自分に許可しない。
  description: >-
    赦されることを拒むため、他者からの好意が罰として作用する。受け取れないという形で欠落が出る。
  effect: 与えられる救いを受け取れない体質にし、救済の難度を上げる。
  pairs_with: [kuma, katami, kako, jiko-gisei]
  contrasts_with: []
  tags: [定番]

- id: soushitsu
  name: 喪失
  kana: そうしつ
  aliases: [失ったもの, 埋まらない席]
  axis: mind.wound
