# 振る舞い／関係

# --- 話し方 ---
- id: keigo
  name: 敬語
  kana: けいご
  aliases: [丁寧語, です・ます]
  axis: mind.speech
  summary: 距離を保つ言語形式。親しさの上限を固定する。
  description: >-
    誰にでも敬語である場合、それは礼儀ではなく壁として働いている。
    崩れる瞬間と、一人にだけ崩れないという運用の両方が使える。
  effect: 距離を言語で可視化し、その変化を関係の計測器にする。
  pairs_with: [shisei, reijou, tsukuri-warai, tebukuro]
  contrasts_with: [dokuzetsu]
  tags: [定番, 計測器]

- id: kuchibeta
  name: 口下手
  kana: くちべた
  aliases: [言葉が足りない, 説明が下手]
  axis: mind.speech
  summary: 意図を言語化できない性質。行動が先に出る。
  description: >-
    誤解が構造的に発生し、行動でしか真意が伝わらない。観客は真意を知っているので焦れが生まれる。
  effect: 言語を封じ、行動と沈黙に意味を集中させる。
  pairs_with: [muhyoujou, me-o-sorasu, shokunin, hitomishiri]
  contrasts_with: [tsukkomi]
  tags: [定番]

- id: ichininshou
  name: 一人称
  kana: いちにんしょう
  aliases: [僕っ娘, わたくし, 俺]
  axis: mind.speech
  summary: 自分を何と呼ぶか。自己認識の宣言。
  description: >-
    見た目や立場から予測される呼び方とずれていると、本人の自己像と周囲の期待の不一致が出る。
    切り替える場面が本音の露出になる。
  effect: 自己認識を一語で提示し、切り替えを内面の切り替えとして読ませる。
  pairs_with: [neko-o-kaburu, nimensei, reijou]
  contrasts_with: []
  tags: [定番]

- id: gobi
  name: 語尾
  kana: ごび
  aliases: [口癖, 特徴的な語尾]
  axis: mind.speech
  summary: 発話の末尾に固定される型。声の指紋。
  description: >-
    反復で記憶に定着し、消えたときに異常が伝わる。本気の場面でだけ外れる運用が定石。
  effect: 平常運転の印を作り、外れた瞬間を非常事態にする。
  pairs_with: [kuchiguse, tenshin, jingai]
  contrasts_with: []
  tags: [反復]

- id: chinmoku
  name: 沈黙
  kana: ちんもく
  aliases: [間, 答えない]
  axis: mind.speech
  summary: 発話しないという選択。肯定にも否定にも読める。
  description: >-
    答えないことは、嘘をつかずに情報を渡さない唯一の方法。沈黙の長さが抱えているものの重さになる。
  effect: 情報を伏せたまま誠実さを保ち、推測を要求する。
  pairs_with: [kako, muhyoujou, mitsumeru, kuchibeta]
  contrasts_with: [hayakuchi]
  tags: [余白]

- id: kogoe
  name: 小声
  kana: こごえ
  aliases: [声が小さい, ぼそぼそ]
  axis: mind.speech
  summary: 音量の低い発話。聞くために近づく必要が出る。
  description: >-
    聞く側に接近を強いるため、音量が物理的な距離を規定する。大声を出した一回が事件になる。
  effect: 会話に近接を要求し、声量の変化を感情の指標にする。
  pairs_with: [hitomishiri, kuudere, jikokoutei]
  contrasts_with: [hayakuchi]
  tags: [近接強制]

- id: hayakuchi
  name: 早口
  kana: はやくち
  aliases: [まくしたてる]
  axis: mind.speech
  summary: 発話速度が速いこと。思考量か動揺が漏れている。
  description: >-
    平常時に早口なら思考が先行しており、普段落ち着いている人物が早口になれば動揺の露出。
    同じ現象が真逆の意味を持つ。
  effect: 速度という一次元で、知性と動揺を同時に表現する。
  pairs_with: [shokunin, tsukkomi, gouri]
  contrasts_with: [kogoe, chinmoku]
  tags: [両義的]

- id: tsukkomi
  name: ツッコミ
  kana: つっこみ
  aliases: [常識人, 苦労人]
  axis: mind.speech
  summary: 場の異常を言語化する役。観客の代弁者。
  description: >-
    最も常識的であるがゆえに、この人物が黙った瞬間に事態の深刻さが伝わる。負荷が一身に集中する。
  effect: 場の基準線を引き、その基準が沈黙したときに異常を知らせる。
  pairs_with: [jitome, sewayaki, hayakuchi]
  contrasts_with: [kuchibeta, tennen]
  tags: [定番, 基準線]

# --- 癖・仕草 ---
- id: mimi-ga-akai
  name: 耳が赤くなる
  kana: みみがあかくなる
  aliases: [首筋が赤い, 顔に出る]
  axis: mind.habit
  summary: 意思で制御できない生理的な露出。
  description: >-
    表情は殺せても血流は殺せない。取り繕いが完璧な人物ほど、この一点だけが裏切る。
  effect: 演技の外側に、制御不能な真実の窓を一つ開ける。
  pairs_with: [muhyoujou, tsundere, kuudere, unaji]
  contrasts_with: []
  tags: [定番, 感情漏れ]

- id: muri
  name: 無理をする
  kana: むりをする
  aliases: [平気なふり, 隠れて倒れる]
  axis: mind.habit
  summary: 限界を申告しない癖。破綻するまで正常に見える。
  description: >-
    周囲が気づけない設計なので、気づいた人物が自動的に特別な位置に立つ。倒れる場面が転換点になる。
  effect: 消耗を不可視にし、見抜いた者だけを内側に入れる。
  pairs_with: [karetsu, jiko-gisei, kuma, tsukuri-warai]
  contrasts_with: []
  tags: [定番, 隠蔽]

- id: me-o-sorasu
  name: 目を逸らす
  kana: めをそらす
  aliases: [視線が合わない]
  axis: mind.habit
  summary: 視線を外す動作。言葉と身体が食い違う瞬間。
  description: >-
    嘘・照れ・罪悪感のどれでも起きるため、観客に解釈を要求する。直後に戻すかで意味が決まる。
  effect: 発話内容を信用しなくていいと知らせる。
  pairs_with: [tsundere, zaiakukan, kuchibeta]
  contrasts_with: [mitsumeru]
  tags: [定番]

- id: mitsumeru
  name: 見つめる
  kana: みつめる
  aliases: [目を逸らさない, 見据える]
  axis: mind.habit
  summary: 視線を固定し続けること。圧としての凝視。
  description: >-
    捕食者の挙動でもあり、誠実さの証明でもある。どちらに転ぶかは相手が先に逸らすかで決まる。
  effect: 会話の主導権を、台詞ではなく視線の持続時間で決める。
  pairs_with: [yoyuu, joushi, kansatsu]
  contrasts_with: [me-o-sorasu, itome]
  tags: [支配]

- id: te-guse
  name: 手癖
  kana: てぐせ
  aliases: [髪を触る, 指を鳴らす]
  axis: mind.habit
  summary: 動揺や思考に伴って出る反復動作。本人は気づいていない。
  description: >-
    親しい人物だけが意味を知っているという二層構造を作れる。「この癖が出ているときは嘘」という読解の規則を置ける。
  effect: 読み取れる者だけに通じる発信チャンネルを作る。
  pairs_with: [te, tebukuro, kansatsu]
  contrasts_with: []
  tags: [反復]

- id: kansatsu
  name: 見ている
  kana: みている
  aliases: [観察癖, 覚えている]
  axis: mind.habit
  summary: 他人の細部を無意識に記録している癖。
  description: >-
    覚えていた事実が不意に出たとき、意図と無関係に関心の量が暴露される。指摘されて初めて自覚する。
  effect: 蓄積した観察を、後から一度に好意の証拠として提出する。
  pairs_with: [gouri, dokuzetsu, yosomono, ryou-kataomoi]
  contrasts_with: []
  tags: [蓄積]

# --- 関係の型 ---
- id: osananajimi
  name: 幼馴染
  kana: おさななじみ
  aliases: [昔からの関係]
  axis: relation.type
  summary: 選ぶ前から成立していた関係。歴史が先にある。
  description: >-
    共有した過去が長いほど、現在の関係を変更するコストが上がる。「今さら言えない」が構造的に発生する。
  effect: 蓄積した安定を、変化への抵抗として働かせる。
  pairs_with: [itsumo-no-basho, yakusoku, ryou-kataomoi]
  contrasts_with: [yosomono]
  tags: [定番]

- id: shujuu
  name: 主従
  kana: しゅじゅう
  aliases: [仕える, 忠誠]
  axis: relation.type
  summary: 命令と服従で結ばれた非対称。役割が感情に先行する。
  description: >-
    命令だから従うのか、そうしたいから従うのかが原理的に判別できない。その判別不能性が核になる。
  effect: 好意と義務を混同させ、両者に判定を保留させ続ける。
  pairs_with: [keigo, kokuin, choker, juusha]
  contrasts_with: [aibou]
  tags: [定番, 非対称]

- id: shitei
  name: 師弟
  kana: してい
  aliases: [師匠と弟子]
  axis: relation.type
  summary: 教える者と教わる者。追い越されることが前提に組まれている。
  description: >-
    継承と同時に立場の逆転が予約されている。教える側が退場することで完成する。
  effect: 関係の終わり方を先に設計し、その到達を目指させる。
  pairs_with: [toshi-no-sa, shokunin, keishou, taijou]
  contrasts_with: []
  tags: [定番]

- id: shukuteki
  name: 宿敵
  kana: しゅくてき
  aliases: [好敵手, ライバル]
  axis: relation.type
  summary: 敵対しながら最も深く理解し合っている関係。
  description: >-
    互いを最も正確に把握しているのが敵同士という逆説が中心。味方より会話が成立してしまう場面が見せ場。
  effect: 敵対という形式のまま、最高密度の相互理解を成立させる。
  pairs_with: [giri, kagami, mitsumeru, yakusoku]
  contrasts_with: []
  tags: [定番, 逆説]

- id: aibou
  name: 相棒
  kana: あいぼう
  aliases: [対等な二人, バディ]
  axis: relation.type
  summary: 上下のない協働関係。
  description: >-
    対等であるがゆえに、片方が欠けた穴が構造的に埋まらない。背中を預ける動作が信頼の可視化になる。
  effect: 対称な関係を作り、欠損時に代替不能であることを保証する。
  pairs_with: [giri, kari, senaka, buki]
  contrasts_with: [shujuu]
  tags: [定番]

- id: hogosha
  name: 保護者
  kana: ほごしゃ
  aliases: [親代わり, 拾った関係]
  axis: relation.type
  summary: 血縁のない養育関係。選択で成立した家族。
  description: >-
    「養う理由がない」という前提があるため、続いていること自体が感情の証明になる。巣立ちが組み込まれる。
  effect: 継続の事実を愛情の証拠に変え、別離を予定する。
  pairs_with: [sewayaki, fuguu, toshi-no-sa, saikai]
  contrasts_with: []
  tags: [定番]

- id: kusare-en
  name: 腐れ縁
  kana: くされえん
  aliases: [切れない関係]
  axis: relation.type
  summary: 好きでも嫌いでもないまま続いてしまっている関係。
  description: >-
    続ける理由が誰にも説明できないことが特徴で、切ろうとして切れない事実だけが積み上がる。
    当人たちが関係を定義しないまま進むため、定義を迫られた瞬間が危機になる。
  effect: 名前のついていない関係を維持し、名付けを事件にする。
  pairs_with: [osananajimi, ryou-kataomoi, surechigai, gishiki]
  contrasts_with: []
  tags: [定番, 未定義]

# --- 関係の状態 ---
- id: ryou-kataomoi
  name: 両片思い
  kana: りょうかたおもい
  aliases: [両想いなのに気づいていない]
  axis: relation.state
  summary: 互いに好きなのに、互いに片想いだと思っている状態。
  description: >-
    関係としては成立しているのに当人たちだけが知らないため、観客の側にだけ確信がある。
    どちらか一方でも確信を持った時点で終わる、極めて壊れやすい平衡状態。
  effect: 成就済みの関係を未成立に見せかけ、観客だけに全部を握らせる。
  pairs_with: [osananajimi, tsundere, kansatsu, surechigai, kusare-en]
  contrasts_with: []
  tags: [定番, 情報非対称]

- id: kataomoi
  name: 片思い
  kana: かたおもい
  aliases: [届かない好意]
  axis: relation.state
  summary: 一方向にだけ向いている好意。
  description: >-
    伝えない理由（資格がない、関係を壊したくない、立場が違う）が、そのまま人物像の説明になる。
  effect: 伝達を保留し続ける理由を通じて、人格を描かせる。
  pairs_with: [juusha, jikokoutei, kuchibeta, kansatsu]
  contrasts_with: []
  tags: [定番]

- id: kyouizon
  name: 共依存
  kana: きょういぞん
  aliases: [お互いに離れられない]
  axis: relation.state
  summary: 互いが互いの欠落を埋め合って、離れられなくなっている状態。
  description: >-
    健全ではないと双方が分かっていることが要件で、外から止める第三者が現れた時に初めて問題として立ち上がる。
  effect: 幸福と破滅の区別を、当人にも観客にもつかなくする。
  pairs_with: [misuterare, jiko-gisei, futari-dake, fuuin]
  contrasts_with: [aibou]
  tags: [定番, 不健全]

- id: surechigai
  name: すれ違い
  kana: すれちがい
  aliases: [噛み合わない]
  axis: relation.state
  summary: 双方に善意があるのに、情報と時機が噛み合わない状態。
  description: >-
    誰も悪くないまま関係が悪化するため、責める相手がいない。観客は両方の事情を知っている。
  effect: 悪役なしで対立を作り、解消の一言だけを引き延ばす。
  pairs_with: [ryou-kataomoi, kuchibeta, chinmoku, saikai]
  contrasts_with: []
  tags: [定番]

- id: kabau
  name: 庇う
  kana: かばう
  aliases: [身を挺する]
  axis: relation.state
  summary: 自分の身体を相手の前に置く動作。優先順位の即時開示。
  description: >-
    思考する時間のない場面で起きるため、言葉より信用できる。庇われた側に負債が発生する。
  effect: 優先順位を反射速度で証明し、同時に負債を作る。
  pairs_with: [jiko-gisei, koushinchou, kari, toshiue]
  contrasts_with: []
  tags: [定番]

- id: gyakuten
  name: 立場の逆転
  kana: たちばのぎゃくてん
  aliases: [追い越す, 守られる側になる]
  axis: relation.state
  summary: 上下が入れ替わること。守る側と守られる側の交代。
  description: >-
    以前の関係が十分に描かれているほど効く。逆転された側の受け入れ方に人格が最も出る。
  effect: 確立した関係を反転させ、蓄積を一度に回収する。
  pairs_with: [shitei, toshi-no-sa, keishou, kabau]
  contrasts_with: []
  tags: [反転]

- id: uragiri
  name: 裏切り
  kana: うらぎり
  aliases: [離反]
  axis: relation.state
  summary: 信頼の前提が破棄されること。
  description: >-
    価値は、それ以前に積んだ信頼の量に完全に比例する。理由が明かされる順番で悲劇にも救済にもなる。
  effect: 蓄積した信頼を燃料にし、過去の全場面の意味を書き換える。
  pairs_with: [shoutai, nimensei, zaiakukan]
  contrasts_with: []
  tags: [定番]

- id: saikai
  name: 再会
  kana: さいかい
  aliases: [数年後, 別離と再会]
  axis: relation.state
  summary: 時間を挟んで関係が再開すること。
  description: >-
    空白の間に何があったかを互いに知らないため、知らない部分の存在が新しい距離になる。
  effect: 関係を一度切り、埋まらない空白を要素として追加する。
  pairs_with: [hogosha, osananajimi, kako, itsumo-no-basho]
  contrasts_with: []
  tags: [定番]

- id: keiyaku
  name: 契約
  kana: けいやく
  aliases: [誓約, 取引]
  axis: relation.state
  summary: 明文化された条件で結ばれた関係。感情の外側にある拘束。
  description: >-
    契約が切れても一緒にいるかという問いが最後に残る。条件を持ち出すことが本心を隠す口実にもなる。
  effect: 関係の根拠を外部化し、失効する日を期限として設定する。
  pairs_with: [yubiwa, kokuin, jinzou, shujuu]
  contrasts_with: []
  tags: [定番]

- id: fuuin
  name: 封印
  kana: ふういん
  aliases: [枷, 抑制]
  axis: relation.state
  summary: 力や存在を押さえつけている仕掛け。解けることが前提にある。
  description: >-
    封じる側と封じられる側の双方に依存が生まれる。解放が救済なのか災厄なのか最後まで確定しない。
  effect: 解放の予感を鳴らし続け、その意味を宙吊りにする。
  pairs_with: [houtai, choker, kokuin, jingai]
  contrasts_with: []
  tags: [抑制]

- id: himitsu-kyouyuu
  name: 秘密の共有
  kana: ひみつのきょうゆう
  aliases: [二人だけが知っている, 共犯]
  axis: relation.state
  summary: 他人に言えない情報を共有している状態。
  description: >-
    秘密の重さが結束の強度になるが、関係を秘密に依存させる。公になると根拠が消える。
  effect: 排他的な結束を作り、それを失う危険と抱き合わせにする。
  pairs_with: [futari-dake, shoutai, chinmoku]
  contrasts_with: []
  tags: [定番]

- id: kari
  name: 借りがある
  kana: かりがある
  aliases: [命の恩, 返せない恩]
  axis: relation.state
  summary: 返しきれない負債。関係を強制的に継続させる。
  description: >-
    返済不能なので、恩を口実に居続けられる。本当は恩など理由ではないという疑いが残る。
  effect: 一緒にいる理由を外部に用意し、告白を先送りさせる。
  pairs_with: [giri, kabau, aibou, kuchibeta]
  contrasts_with: []
  tags: [口実]
