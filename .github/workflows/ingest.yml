name: ingest

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 05:00 JST
  workflow_dispatch:
    inputs:
      only:
        description: "このキャラ id だけ強制実行（空なら通常選定）"
        required: false
      limit:
        description: "処理する最大件数"
        required: false
        default: "5"
  push:
    paths:
      - data/queue.yaml

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: キューを処理する
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || 5 }}"
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          python3 tools/ingest/auto.py $ARGS

      - name: 検証してビルドする
        run: python3 tools/build.py

      - name: 変更があればコミットする
        run: |
          git config user.name "heki-database-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- docs/data/db.json
          if [ -f data/suggestions.yaml ]; then git add -- data/suggestions.yaml; fi
          if [ -f data/characters_auto.yaml ]; then
            git add -- data/characters_auto.yaml
          fi
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          COUNT=$(python3 -c "import yaml;print(len(yaml.safe_load(open('data/characters_auto.yaml')) or []))" 2>/dev/null || echo "0")
          git commit -m "自動取り込み: characters_auto を更新（収録 ${COUNT} 名）"
          git push
