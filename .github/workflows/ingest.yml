name: ingest

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 05:00 JST
  workflow_dispatch:
    inputs:
      only:
        description: "このキャラ id だけ強制実行（空なら通常選定）"
        required: false
      limit:
        description: "処理する最大件数"
        required: false
        default: "12"
      refresh_all:
        description: "期限に関係なく全件を取り直す（見出し語を足した後に使う）"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - data/queue.yaml

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: キューを処理する
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || 12 }}"
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          if [ "${{ github.event.inputs.refresh_all }}" = "true" ]; then
            ARGS="$ARGS --refresh-all"
          fi
          python3 tools/ingest/auto.py $ARGS

      - name: 検証してビルドする
        run: python3 tools/build.py

      - name: 変更があればコミットする
        run: |
          git config user.name "heki-database-bot"
          git config user.email "actions@users.noreply.github.com"

          # 取り込みは 1 時間かかることがあり、その間に別の実行が先にコミットしうる。
          # 生成物は行マージできないので rebase に任せず、id 単位で突き合わせて統合する。
          SAVED=$(mktemp -d)
          cp data/characters_auto.yaml "$SAVED/" 2>/dev/null || true
          cp data/suggestions.yaml "$SAVED/" 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python3 tools/ingest/reconcile.py "$SAVED"
            python3 tools/build.py

            git add -- docs/data/db.json README.md
            if [ -f data/characters_auto.yaml ]; then git add -- data/characters_auto.yaml; fi
            if [ -f data/suggestions.yaml ]; then git add -- data/suggestions.yaml; fi
            if git diff --cached --quiet; then
              echo "変更なし"
              exit 0
            fi

            COUNT=$(python3 -c "import yaml;print(len(yaml.safe_load(open('data/characters_auto.yaml')) or []))" 2>/dev/null || echo "0")
            git commit -m "自動取り込み: characters_auto を更新（収録 ${COUNT} 名）"
            if git push; then
              exit 0
            fi
            echo "プッシュが弾かれました（${attempt} 回目）。取り込み直して再試行します。"
          done
          echo "3 回試してもプッシュできませんでした。"
          exit 1
